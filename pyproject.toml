[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-app-pipeline"
version = "0.1.0"
description = "A local iOS delivery pipeline with verified artifacts and resumable runs."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zemixo"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Build Tools"]

[project.urls]
Repository = "https://github.com/zemixo/ios-app-pipeline"
Issues = "https://github.com/zemixo/ios-app-pipeline/issues"

[project.scripts]
ios-pipeline = "ios_pipeline:main"

[tool.setuptools]
py-modules = ["ios_pipeline"]
